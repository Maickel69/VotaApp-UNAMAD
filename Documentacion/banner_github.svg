<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D1F" />
      <stop offset="50%" stop-color="#0F2460" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" rx="24" fill="url(#bgGrad)" />

  <!-- Subtle Grid / Glow Orbs -->
  <circle cx="1050" cy="70" r="180" fill="#3B82F6" opacity="0.14" />
  <circle cx="160" cy="290" r="150" fill="#34D399" opacity="0.10" />
  <circle cx="880" cy="270" r="130" fill="#6366F1" opacity="0.12" />

  <!-- Top Pill Badge -->
  <rect x="64" y="42" width="410" height="32" rx="16" fill="#1E293B" stroke="#3B82F6" stroke-width="1.2" opacity="0.9" />
  <circle cx="84" cy="58" r="5" fill="#34D399" />
  <text x="100" y="63" font-family="Segoe UI, Roboto, Ubuntu, sans-serif" font-size="12.5" font-weight="700" fill="#E2E8F0" letter-spacing="1.2">UNAMAD • INGENIERÍA DE SISTEMAS E INFORMÁTICA</text>

  <!-- Main Title -->
  <text x="64" y="138" font-family="Segoe UI, Roboto, Ubuntu, sans-serif" font-size="54" font-weight="800" fill="#FFFFFF">VotaApp UNAMAD</text>
  <rect x="64" y="156" width="240" height="5" rx="2.5" fill="url(#accentGrad)" />

  <!-- Subtitle -->
  <text x="64" y="198" font-family="Segoe UI, Roboto, Ubuntu, sans-serif" font-size="20" font-weight="400" fill="#CBD5E1">
    Sistema Cloud de Encuestas Académicas, Sufragio Estudiantil y Escrutinio en Tiempo Real
  </text>

  <!-- Feature Badges Row -->
  <g transform="translate(64, 232)">
    <rect x="0" y="0" width="150" height="38" rx="12" fill="#172554" stroke="#3B82F6" stroke-width="1" />
    <text x="75" y="24" text-anchor="middle" font-family="Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#93C5FD">Kotlin + MD3</text>

    <rect x="164" y="0" width="185" height="38" rx="12" fill="#064E3B" stroke="#34D399" stroke-width="1" />
    <text x="256" y="24" text-anchor="middle" font-family="Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#6EE7B7">Firebase Cloud</text>

    <rect x="363" y="0" width="195" height="38" rx="12" fill="#2E1065" stroke="#A78BFA" stroke-width="1" />
    <text x="460" y="24" text-anchor="middle" font-family="Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#DDD6FE">Padrón Excel / CSV</text>

    <rect x="572" y="0" width="175" height="38" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
    <text x="659" y="24" text-anchor="middle" font-family="Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#7DD3FC">GitHub Actions CI</text>
  </g>

  <!-- Right Graphic: Stylized Ballot & Donut Chart Card -->
  <g transform="translate(880, 52)">
    <rect x="0" y="0" width="256" height="236" rx="22" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <!-- Donut Chart Ring -->
    <circle cx="128" cy="95" r="46" fill="none" stroke="#1E293B" stroke-width="14" />
    <circle cx="128" cy="95" r="46" fill="none" stroke="#3B82F6" stroke-width="14" stroke-dasharray="180 290" stroke-linecap="round" transform="rotate(-90 128 95)" />
    <circle cx="128" cy="95" r="46" fill="none" stroke="#34D399" stroke-width="14" stroke-dasharray="75 290" stroke-dashoffset="-190" stroke-linecap="round" transform="rotate(-90 128 95)" />
    <text x="128" y="93" text-anchor="middle" font-family="Segoe UI, Roboto, sans-serif" font-size="19" font-weight="800" fill="#F8FAFC">100%</text>
    <text x="128" y="110" text-anchor="middle" font-family="Segoe UI, Roboto, sans-serif" font-size="10" font-weight="600" fill="#94A3B8">TIEMPO REAL</text>

    <!-- Progress Bars inside Card -->
    <rect x="28" y="164" width="200" height="10" rx="5" fill="#1E293B" />
    <rect x="28" y="164" width="148" height="10" rx="5" fill="#3B82F6" />
    <rect x="28" y="186" width="200" height="10" rx="5" fill="#1E293B" />
    <rect x="28" y="186" width="96" height="10" rx="5" fill="#34D399" />
    <text x="128" y="218" text-anchor="middle" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#CBD5E1">Voto Único Verificado por UID</text>
  </g>
</svg>
